{% extends 'base.html' %}
{% block content %}
<h2>{{ 'Edit Project' if project else 'New Project' }} — {{ client.name }}</h2>
<form method="post" class="mt-3">
  <div class="mb-3">
    <label class="form-label">Name</label>
    <input name="name" class="form-control" value="{{ project.name if project else '' }}" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Description</label>
    <textarea name="description" class="form-control" rows="3">{{ project.description if project else '' }}</textarea>
  </div>
  <button class="btn btn-primary">Save</button>
  <a href="{{ url_for('list_projects', client_id=client.id) }}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}

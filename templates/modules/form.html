{% extends 'base.html' %}
{% block content %}
<h2>{{ 'Edit Module' if module else 'New Module' }} — {{ project.name }}</h2>
<form method="post" class="mt-3">
  <div class="mb-3">
    <label class="form-label">Name</label>
    <input name="name" class="form-control" value="{{ module.name if module else '' }}" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Description</label>
    <textarea name="description" class="form-control" rows="3">{{ module.description if module else '' }}</textarea>
  </div>
  <button class="btn btn-primary">Save</button>
  <a href="{{ url_for('list_modules', project_id=project.id) }}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}

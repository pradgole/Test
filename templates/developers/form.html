{% extends 'base.html' %}
{% block content %}
<h2>{{ 'Edit Developer' if developer else 'New Developer' }}</h2>
<form method="post" class="mt-3">
  <div class="mb-3">
    <label class="form-label">Name</label>
    <input name="name" class="form-control" value="{{ developer.name if developer else '' }}" required>
  </div>
  <button class="btn btn-primary">Save</button>
  <a href="{{ url_for('list_developers') }}" class="btn btn-secondary">Cancel</a>
{% endblock %}

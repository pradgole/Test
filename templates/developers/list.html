{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h2>Developers</h2>
  <a href="{{ url_for('create_developer') }}" class="btn btn-primary">New Developer</a>
</div>

<div class="card">
  <div class="card-body p-0">
    <table class="table mb-0 table-hover align-middle">
      <thead>
        <tr>
          <th>Name</th>
          <th style="width:200px"></th>
        </tr>
      </thead>
      <tbody>
      {% for d in developers %}
        <tr>
          <td>{{ d.name }}</td>
          <td class="text-end">
            <a class="btn btn-sm btn-outline-primary" href="{{ url_for('edit_developer', developer_id=d.id) }}">Edit</a>
            <form method="post" class="d-inline" action="{{ url_for('delete_developer', developer_id=d.id) }}" onsubmit="return confirm('Delete developer?')">
              <button class="btn btn-sm btn-outline-danger">Delete</button>
            </form>
          </td>
        </tr>
      {% else %}
        <tr><td colspan="2" class="text-center text-muted">No developers yet.</td></tr>
      {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}

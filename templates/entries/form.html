{% extends 'base.html' %}
{% block content %}
<h2>{{ 'Edit Entry' if entry else 'New Entry' }} — {{ module.name }}</h2>
<form method="post" class="row g-3 mt-1">
  <div class="col-md-3">
    <label class="form-label">Event ID</label>
    <input name="event_id" class="form-control" value="{{ entry.event_id if entry else '' }}">
  </div>
  <div class="col-md-5">
    <label class="form-label">Template Type</label>
    <input name="template_type" class="form-control" value="{{ entry.template_type if entry else '' }}">
  </div>
  <div class="col-md-2">
    <label class="form-label">Subevents</label>
    <input name="subevents_count" type="number" step="1" class="form-control" value="{{ entry.subevents_count if entry else '' }}">
  </div>

  <div class="col-md-2">
    <label class="form-label">Estimated</label>
    <input name="estimated_efforts" type="number" step="0.01" class="form-control" value="{{ entry.estimated_efforts if entry else '' }}">
  </div>
  <div class="col-md-2">
    <label class="form-label">Actual</label>
    <input name="actual_efforts" type="number" step="0.01" class="form-control" value="{{ entry.actual_efforts if entry else '' }}">
  </div>

  <div class="col-md-3">
    <label class="form-label">Content Integration</label>
    <input name="content_integration_status" class="form-control" value="{{ entry.content_integration_status if entry else '' }}" placeholder="Done / Pending">
  </div>
  <div class="col-md-3">
    <label class="form-label">Assets/Alignment</label>
    <input name="assets_alignment_status" class="form-control" value="{{ entry.assets_alignment_status if entry else '' }}" placeholder="Done / Pending">
  </div>

  <div class="col-md-4">
    <label class="form-label">Developers</label>
    <select class="form-select" name="developer_ids" multiple size="4">
      {% set selected = (entry.developers | map(attribute='id') | list) if entry else [] %}
      {% for d in developers %}
        <option value="{{ d.id }}" {% if d.id in selected %}selected{% endif %}>{{ d.name }}</option>
      {% endfor %}
    </select>
    <div class="form-text">Hold Ctrl/Cmd to select multiple.</div>
  </div>

  <div class="col-12">
    <label class="form-label">Comments</label>
    <textarea name="comments" class="form-control" rows="3">{{ entry.comments if entry else '' }}</textarea>
  </div>

  <div class="col-12">
    <button class="btn btn-primary">Save</button>
    <a href="{{ url_for('list_entries', module_id=module.id) }}" class="btn btn-secondary">Cancel</a>
  </div>
</form>
{% endblock %}

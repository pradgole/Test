{% extends 'base.html' %}
{% block content %}
<h2>{{ 'Edit Client' if client else 'New Client' }}</h2>

<form method="post" class="mt-3">
  <div class="mb-3">
    <label class="form-label">Name</label>
    <input name="name" class="form-control" value="{{ client.name if client else '' }}" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Description</label>
    <textarea name="description" class="form-control" rows="3">{{ client.description if client else '' }}</textarea>
  </div>
  <button class="btn btn-primary">Save</button>
  <a href="{{ url_for('list_clients') }}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}

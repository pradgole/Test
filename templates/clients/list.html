{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h2>Clients</h2>
  <a href="{{ url_for('create_client') }}" class="btn btn-primary">New Client</a>
  </div>

<div class="card">
  <div class="card-body p-0">
    <table class="table mb-0 table-hover align-middle">
      <thead>
        <tr>
          <th>Name</th>
          <th>Description</th>
          <th style="width:220px"></th>
        </tr>
      </thead>
      <tbody>
      {% for c in clients %}
        <tr>
          <td><a href="{{ url_for('list_projects', client_id=c.id) }}">{{ c.name }}</a></td>
          <td>{{ c.description }}</td>
          <td class="text-end">
            <a class="btn btn-sm btn-outline-secondary" href="{{ url_for('list_projects', client_id=c.id) }}">Projects</a>
            <a class="btn btn-sm btn-outline-primary" href="{{ url_for('edit_client', client_id=c.id) }}">Edit</a>
            <form method="post" action="{{ url_for('delete_client', client_id=c.id) }}" class="d-inline" onsubmit="return confirm('Delete client?')">
              <button class="btn btn-sm btn-outline-danger">Delete</button>
            </form>
          </td>
        </tr>
      {% else %}
        <tr><td colspan="3" class="text-center text-muted">No clients yet.</td></tr>
      {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
